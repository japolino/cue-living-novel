<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Cue v1.6.0-beta: before and after System 1</title>
  <desc id="desc">Before, each new turn uses the Gemini 3.8 Flash planner. After, optional Jev decisions can reuse a scene and skip the planner. Illustrative decision latency is about 3.0 seconds before and 0.6 seconds for the fast path.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#858b94"/></marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #d9dde4; }
      .label { font-size: 20px; font-weight: 700; }
      .small { font-size: 15px; fill: #b6bbc4; }
      .node { font-size: 18px; font-weight: 620; text-anchor: middle; }
      .note { font-size: 17px; fill: #bfc5cb; }
      .edge { fill: none; stroke: #858b94; stroke-width: 1.6; marker-end: url(#arrow); }
      .box { fill: #1b2028; stroke: #647896; stroke-width: 1.4; rx: 18; }
      .planner { fill: #172932; stroke: #70b2d5; }
      .jev { fill: #251e30; stroke: #a48ad7; }
      .gate { fill: #201f2b; stroke: #9382c7; stroke-dasharray: 3 3; }
      .reuse { fill: #172923; stroke: #70c29b; }
      .output { fill: #392c14; stroke: #ac8741; }
      .chip { fill: #292c2f; stroke: #be9b58; rx: 11; }
    </style>
  </defs>

  <rect width="1600" height="620" fill="#17191e"/>
  <text x="30" y="40" font-size="24" font-weight="760" fill="#f2e3c7">CUE · v1.6.0-beta</text>
  <text x="1570" y="40" text-anchor="end" class="small">System 1 is optional · Gemini 3.8 Flash planner baseline</text>

  <rect x="16" y="64" width="1568" height="185" rx="3" fill="#272a30"/>
  <text x="40" y="94" class="label">BEFORE</text>
  <text x="145" y="94" class="small">Planner-only path</text>
  <text x="1560" y="94" text-anchor="end" class="note">~3.0 s planner decision · estimate</text>
  <rect class="box" x="40" y="121" width="165" height="84"/>
  <rect class="box" x="240" y="121" width="185" height="84"/>
  <rect class="box planner" x="460" y="121" width="230" height="84"/>
  <rect class="box" x="725" y="121" width="195" height="84"/>
  <rect class="box" x="955" y="121" width="185" height="84"/>
  <rect class="box output" x="1175" y="121" width="365" height="84"/>
  <path class="edge" d="M205 163 H238 M425 163 H458 M690 163 H723 M920 163 H953 M1140 163 H1173"/>
  <text class="node" x="122" y="169">Assistant reply</text>
  <text class="node" x="332" y="157"><tspan x="332">Deterministic</tspan><tspan x="332" dy="22">paragraph split</tspan></text>
  <text class="node" x="575" y="157"><tspan x="575">Gemini 3.8 Flash</tspan><tspan x="575" dy="22">visual planner</tspan></text>
  <text class="node" x="822" y="157"><tspan x="822">Validate + select</tspan><tspan x="822" dy="22">poses / image cues</tspan></text>
  <text class="node" x="1047" y="157"><tspan x="1047">Image cache</tspan><tspan x="1047" dy="22">or generate</tspan></text>
  <text class="node" x="1357" y="157"><tspan x="1357">BGM / SFX + VN display</tspan><tspan x="1357" dy="22">art, paragraphs, choices</tspan></text>
  <text x="40" y="231" class="small">The planner handles scene details, speaker, visual cues and audio before the deterministic rules run.</text>

  <rect x="16" y="265" width="1568" height="340" rx="3" fill="#272a30"/>
  <text x="40" y="298" class="label">AFTER</text>
  <text x="123" y="298" class="small">System 1 On</text>
  <text x="1560" y="298" text-anchor="end" class="note">~0.6 s Jev fast path · ~2.4 s saved · estimate</text>

  <rect class="box" x="40" y="375" width="165" height="84"/>
  <rect class="box" x="240" y="375" width="185" height="84"/>
  <rect class="box jev" x="460" y="375" width="205" height="84"/>
  <rect class="box gate" x="700" y="375" width="165" height="84"/>
  <rect class="box planner" x="920" y="320" width="195" height="78"/>
  <rect class="box reuse" x="920" y="450" width="195" height="78"/>
  <rect class="box" x="1160" y="375" width="175" height="84"/>
  <rect class="box output" x="1370" y="375" width="190" height="84"/>

  <path class="edge" d="M205 417 H238 M425 417 H458 M665 417 H698"/>
  <path class="edge" d="M865 407 H890 V359 H918"/>
  <path class="edge" d="M865 427 H890 V489 H918"/>
  <path class="edge" d="M1115 359 H1137 V401 H1158"/>
  <path class="edge" d="M1115 489 H1137 V433 H1158"/>
  <path class="edge" d="M1335 417 H1368"/>

  <text class="node" x="122" y="423">Assistant reply</text>
  <text class="node" x="332" y="411"><tspan x="332">Deterministic</tspan><tspan x="332" dy="22">paragraph split</tspan></text>
  <text class="node" x="562" y="400"><tspan x="562">Jev</tspan><tspan x="562" dy="22">speaker · pose</tspan><tspan x="562" dy="22">BGM · SFX</tspan></text>
  <text class="node" x="782" y="411"><tspan x="782">Can reuse</tspan><tspan x="782" dy="22">the scene?</tspan></text>
  <text class="node" x="1017" y="351"><tspan x="1017">Gemini 3.8 Flash</tspan><tspan x="1017" dy="22">full visual plan</tspan></text>
  <text class="node" x="1017" y="481"><tspan x="1017">Reuse scene</tspan><tspan x="1017" dy="22">assemble locally</tspan></text>
  <text class="node" x="1247" y="411"><tspan x="1247">Deterministic</tspan><tspan x="1247" dy="22">selection + cache</tspan></text>
  <text class="node" x="1465" y="411"><tspan x="1465">Images +</tspan><tspan x="1465" dy="22">VN display</tspan></text>
  <rect class="chip" x="870" y="332" width="39" height="23"/><text x="889" y="349" text-anchor="middle" font-size="14" font-weight="700" fill="#edc883">No</text>
  <rect class="chip" x="870" y="474" width="39" height="23"/><text x="889" y="491" text-anchor="middle" font-size="14" font-weight="700" fill="#edc883">Yes</text>
  <text x="40" y="565" class="small">Illustrative decision time only. Main reply, image generation and network delays are excluded. A cache hit can save image time on either path.</text>
</svg>
